 je_rome_augustus_status_africa:0 "可选目标：吞并 [GetGeographicRegion('geographic_region_roman_africa').GetName] —— 点击按钮直接获取。"
 je_rome_augustus_status_italy:0 "点击「宣称意大利」获取 [GetGeographicRegion('geographic_region_roman_italia').GetName] 的宣称。"
 je_rome_augustus_status_conquer_italy:0 "正在征服 [GetGeographicRegion('geographic_region_roman_italia').GetName] —— 控制全部领土后解锁下一个宣称。"
 je_rome_augustus_status_conquer_hispania:0 "正在征服 [GetGeographicRegion('geographic_region_roman_hispania').GetName] —— 控制全部领土后解锁下一个宣称。"
 je_rome_augustus_status_conquer_danube:0 "正在征服 [GetGeographicRegion('geographic_region_roman_danube').GetName] —— 控制全部领土后解锁下一个宣称。"
 je_rome_augustus_status_conquer_gallia:0 "正在征服 [GetGeographicRegion('geographic_region_roman_gallia').GetName] —— 控制全部领土后解锁下一个宣称。"
 je_rome_augustus_status_conquer_britannia:0 "正在征服 [GetGeographicRegion('geographic_region_roman_britannia').GetName] —— 控制全部领土后解锁最终加冕。"
 je_rome_augustus_status_final:0 "全部领土已征服！点击「加冕奥古斯都」完成最终议程。"

 je_rome_augustus_italy_button:0 "宣称意大利"
 je_rome_augustus_italy_button_desc:0 "获取意大利地区所有故土的宣称。征服意大利后方可解锁下一个宣称。"

 je_rome_augustus_egypt_button:0 "吞并东方行省"
 je_rome_augustus_egypt_button_desc:0 "直接吞并整个东方行省：埃及（下埃及、中埃及、上埃及、西奈、埃及沙漠、马特鲁）+ 黎凡特（塞浦路斯、巴勒斯坦、黎巴嫩、叙利亚、阿勒颇、约旦）+ 美索不达米亚（巴格达、摩苏尔、代尔祖尔、巴士拉），全部设为直辖。"

 je_rome_augustus_africa_button:0 "吞并北非"
 je_rome_augustus_africa_button_desc:0 "直接吞并北非全部领土（的黎波里、突尼斯、阿尔及尔、君士坦丁、奥兰、非斯、马拉喀什、里夫、利比亚、内摩洛哥），设为直辖。"

 je_rome_augustus_hispania_button:0 "宣称伊比利亚"
 je_rome_augustus_hispania_button_desc:0 "获取伊比利亚地区所有故土的宣称。征服伊比利亚后，「重建中的罗马」获得贸易优势+25%、贸易容量+25%，并解锁下一个宣称。"

 je_rome_augustus_danube_button:0 "宣称多瑙河地区"
 je_rome_augustus_danube_button_desc:0 "获取多瑙河地区所有故土的宣称。征服多瑙河地区后，「重建中的罗马」获得攻/防+20%，并解锁下一个宣称。"

 je_rome_augustus_gallia_button:0 "宣称高卢"
 je_rome_augustus_gallia_button_desc:0 "获取高卢地区所有故土的宣称。征服高卢后，「重建中的罗马」获得击杀率/士气打击/康复率/士气恢复+20%，并解锁下一个宣称。"

 je_rome_augustus_britannia_button:0 "宣称不列颠"
 je_rome_augustus_britannia_button_desc:0 "获取不列颠地区所有故土的宣称。征服不列颠后，额外获得永久修正「条条大路通罗马」，并解锁最终奖励。"

 je_rome_augustus_final_button:0 "加冕奥古斯都"
 je_rome_augustus_final_button_desc:0 "所有宣称领土均已征服。加冕为奥古斯都，授予永久性修正：立法成功率+50%。"

 rome_augustus:0 "奥古斯都"
 rome_augustus_desc:0 "立法成功率+50%"

 rome_senate_reformed:0 "元老院的智慧（Senatus Auctoritas）"
 rome_senate_reformed_desc:0 "行政力+5000，政府合法性+30，立法成功率+30%，制定法律速度+20%。"

 # ===== 国家议程：元老院 =====
 je_rome_senate:0 "元老院"
 je_rome_senate_reason:0 "恢复元老院的荣光，让古老的智慧指引帝国前行。元老院掌握三项核心权力：确立帝国的治理原则，设计罗马特色的三级权力分配选举制度，以及颁布万民法以协调各民族关系。\n\n当所有非边缘利益集团的支持度均大于等于0时，可解锁「恢复罗马混合共和制」。随时可实施「罗马三级权力分配」和「万民法」。"

 je_rome_senate_button:0 "恢复罗马混合共和制"
 je_rome_senate_button_desc:0 "变更治理原则为罗马混合共和制：权威力+100，国家元首所属利益集团执政合法性+20，基于选票的合法性+20，政府规模限额+1。"

 je_rome_senate_three_tier_button:0 "实施罗马三级权力分配"
 je_rome_senate_three_tier_button_desc:0 "变更权力分配为罗马三级权力分配（选举制度）：权威力+100，贵族/教士/军官政治力量+100%，工程师/学者政治力量+33%，基于政府势力的合法性+60，投票财富门槛+10，基于选票的合法性+85，政府规模限额+1。军队、地主、教廷、实业家强烈支持。"

 je_rome_senate_jus_gentium_button:0 "颁布万民法"
 je_rome_senate_jus_gentium_button_desc:0 "变更公民权为万民法：大幅提升各文化接受度（主流文化+100，共享遗产+80，共享语言+80，传统+25），改善非接纳文化的政治力量与工资待遇，促进文化融合。"

 # ===== 国家议程：我们的海（辅助脱困） =====
 je_rome_mare_nostrum:0 "我们的海"
 je_rome_mare_nostrum_reason:0 "地中海应是罗马的内湖，但岛屿与飞地常被列强据为筹码，使光复之路步履维艰。\n\n点击下方按钮，可直接获取当前奥古斯都阶段所需的全部地块（设为直辖），从而解锁下一阶段的宣称。若征战受阻、厌倦为一座小岛反复拉锯，这里便是破局之径。"
 je_rome_mare_nostrum_button:0 "获取当前阶段地块"
 je_rome_mare_nostrum_button_desc:0 "检测当前奥古斯都阶段，直接将对应地区的所有州区域授予我国并设为直辖，并立即推进至下一阶段。点击后该地区即被我方完全掌握，下一阶段宣称按钮随之解锁，重建中的罗马修正也会同步升级。"

 # ===== 新法律本地化（原版风格风味简介，效果由游戏自动列出）=====
 law_roman_mixed_republic:0 "罗马混合共和制"
 law_roman_mixed_republic_desc:0 "执政官、元老院与公民大会三者相衡，任何一方都无法独揽权柄。虽由元首临朝，国家的权柄却始终源于罗马古老的宪制传统。"

 law_byzantine_three_tier:0 "罗马三级权力分配"
 law_byzantine_three_tier_desc:0 "仿古罗马百官列序之制：贵族、教士与军官居于第一等级，学者与工程师次之，全体罗马公民居于第三等级，各依其职共享治权。"

 # ===== 公民权法律本地化 =====
 law_jus_gentium:0 "万民法"
 law_jus_gentium_desc:0 "万民法乃罗马治理万邦之公法。无论生于何种民族，凡遵罗马律法者，皆可循阶而进，终为罗马公民——Civis Romanus sum。"

 EFFECTS_ON_ACCEPTANCE_law_jus_gentium:0 "接纳度低的族群将面临诸多限制；随着接纳度提升，各族群将逐步获得完整的投票权、政治力量与同化之路，最终融入罗马的公民大家庭。"

 # ===== 地区特质 =====
 state_trait_rome_constantinople_trade:0 "君士坦丁堡贸易中枢"
 state_trait_rome_constantinople_trade_desc:0 "市场介入度的地区价格影响+5%，贸易容量+25%"

 # ===== 国家议程：希腊觉醒 =====
 je_rome_greek_awakening:0 "希腊觉醒"
 je_rome_greek_awakening_reason:0 "希腊，西方文明的摇篮，正迎来一场新的觉醒。古老的智慧与现代的科学相结合，将推动我们的国家走向辉煌。\n\n每周创新力+500（持续10年），受教育机会+50%（永久），每周税收+50000（持续到重建东罗马）。\n\n当全国识字率达到70%时，本议程自动完成，获得科技扩散加成。"

 je_rome_greek_awakening_loyalists_button:0 "安抚民心"
 je_rome_greek_awakening_loyalists_button_desc:0 "增加各阶层效忠派以稳定民心，防止因快速现代化引发的革命。（12个月冷却）"

 # ===== 新增修正本地化 =====
 rome_greek_treasury_boost:0 "希腊金库"
