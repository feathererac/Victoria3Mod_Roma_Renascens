 rome_literacy_boost:0 "全民启蒙"
 rome_literacy_boost_desc:0 "受教育机会+50%"

 rome_roman_spark:0 "罗马火种"
 rome_roman_spark_desc:0 "军团攻击+30，防御+30，杀伤率+30%，士气打击+30%（点燃后持续十年）"

 rome_professional_army:0 "纪律严明的职业军队"
 rome_professional_army_desc:0 "东罗马已然重建，军团已百炼成钢。虽然征服的狂热逐渐褪去，但严明的纪律和过硬的素质已成为军队的灵魂。"
 rome_professional_army_mod:0 "纪律严明的职业军队"
 rome_professional_army_mod_desc:0 "军团攻击+10，防御+10，杀伤率+10%，士气打击+10%"

 rome.1.t:0 "我们已经重建东罗马了"
 rome.1.desc:0 "经过浴血奋战，君士坦丁堡的城头再次升起了罗马的旗帜。东罗马帝国已经浴火重生，但这只是开始。整个地中海世界都曾是罗马的疆域，我们的使命远未完成。让我们彻底重建罗马帝国，让鹰旗再次照耀整个已知世界。"
 rome.1.a:0 "彻底重建罗马帝国"

 # ===== 重建罗马系列决议 =====
 rome_tranquil_triumph:0 "宁静的凯旋"
 rome_tranquil_triumph_desc:0 "罗马的扩张不再伴随着无尽的仇恨与恐惧。我们以宽仁治世，以威仪服人，让被征服者心甘情愿地臣服于罗马的荣光之下。"
 rome_tranquil_triumph_tooltip:0 "获得永久修正：恶名获取-90%，外交博弈行动力+600"

 rome_tranquil_triumph_mod:0 "宁静的凯旋"
 rome_tranquil_triumph_mod_desc:0 "恶名获取-90%，外交博弈行动力+600"

 rome_annex_aegean:0 "爱琴海明珠"
 rome_annex_aegean_desc:0 "克里特岛与伊奥尼亚群岛自古以来便是希腊文明的珠宝。当我们的国力足够强盛时，这些岛屿理应回归祖国的怀抱。"
 rome_annex_aegean_tooltip:0 "立即吞并克里特岛和伊奥尼亚群岛。"
 rome_annex_aegean_requirements:0 "要求：国际地位达到次要政权或更高"

 # ===== 国家议程：宣布重建罗马（最终） =====
 je_rome_declare_imperium:0 "宣布重建罗马"
 je_rome_declare_imperium_reason:0 "当鹰旗再度在博斯普鲁斯海峡的晨风中聚拢，当「元老院与罗马人民」之名重新在亿万人口中低语——古老而庄严的召唤已不可回避。\n\n点燃重建的烽火：我们的旗帜将化作罗马的鹰旗，众神重归万神殿，罗马人的血脉与认同将在四海之内苏醒。旧时代的两份馈赠——希腊的金库与凯旋的宁静——也将熔铸为「重建中的罗马」，在收复每一片故土的征程中愈发光辉；待帝国的全部疆土尽归鹰旗之下，重建方告圆满，「永恒罗马」的时代便随之降临。\n\n前提：我们已是拜占庭帝国。"

 je_rome_declare_imperium_button:0 "宣布重建罗马"
 je_rome_declare_imperium_button_desc:0 "升起罗马鹰旗，重建罗马帝国：旗帜与地图颜色重归罗马，主流文化与国教罗马化，诸利益集团归位。希腊金库与宁静的凯旋将熔铸为「重建中的罗马」，并随征服进程不断增强；全部疆土光复后，它将升华为「永恒罗马」。"

 rome_imperium_aeternum:0 "永恒罗马（Imperium Aeternum）"
 rome_imperium_aeternum_desc:0 "行政力+5000，权威力+400，赋税收入+50000，攻/防+20%，击杀率/士气打击/康复率/士气恢复+20%，恶名产生-50%，外交博弈行动力+900，创新力+400/创新力上限+400，动乱地区惩罚-50%，贸易优势+25%/贸易容量+25%。"

 rome_rebuilding:0 "重建中的罗马"
 rome_rebuilding_desc:0 "赋税收入+50000，恶名产生-70%，外交博弈行动力+900。随着奥古斯都议程逐次征服故土，这份增益会逐步增强。"
 rome_rebuilding_2:0 "重建中的罗马"
 rome_rebuilding_2_desc:0 "赋税收入+50000，恶名产生-70%，外交博弈行动力+900，贸易优势+25%，贸易容量+25%（已征服伊比利亚）。"
 rome_rebuilding_3:0 "重建中的罗马"
 rome_rebuilding_3_desc:0 "赋税收入+50000，恶名产生-70%，外交博弈行动力+900，贸易优势+25%/贸易容量+25%，攻/防+20%（已征服多瑙河）。"
 rome_rebuilding_4:0 "重建中的罗马"
 rome_rebuilding_4_desc:0 "赋税收入+50000，恶名产生-70%，外交博弈行动力+900，贸易优势+25%/贸易容量+25%，攻/防+20%，击杀率/士气打击/康复率/士气恢复+20%（已征服高卢）。"

 rome_viae_romanae:0 "条条大路通罗马"
 rome_viae_romanae_desc:0 "赋税收入+50000，皈依/同化速度+40%，基础设施+10%，港口吞吐量+10%。"

 je_rome_arabia_annex_button:0 "吞并阿拉伯半岛"
 je_rome_arabia_annex_button_desc:0 "以罗马帝国之威直接吞并整个阿拉伯半岛（汉志、内志、哈伊勒、阿曼、阿布扎比、也门），并将其完全整合。\n条件：已重建罗马且国际地位达到列强。一次性。"

 # ===== 国家议程：罗马火种 =====
 je_rome_roman_spark:0 "罗马火种"
 je_rome_roman_spark_reason:0 "伟大理想的火焰已在海岸与山峦间点燃。军团的鹰徽沉睡已久，可百夫长的号角从未真正远去——在向君士坦丁堡进军之前，先让这颗火种燃成燎原之势。\n\n点燃火种：十年之内，军团将士战意高昂（攻击与防御+30，杀伤率与士气打击+30%），我们同时获得奥斯曼治下所有故土的宣称。待到东罗马浴火重生，火种将淬炼为「纪律严明的职业军队」。"
 je_rome_roman_spark_button:0 "点燃罗马火种"
 je_rome_roman_spark_button_desc:0 "获得「罗马火种」修正（攻击/防御+30，杀伤率与士气打击+30%，持续十年），并对奥斯曼境内所有故土获得宣称。"

 # ===== 国家议程：稳固行省 =====
 je_rome_secure_provinces:0 "稳固行省"
 je_rome_secure_provinces_reason:0 "我们的疆域日益辽阔，但许多新征服的领土仍处于未整合状态。我们必须将这些土地彻底纳入帝国的统治体系，消除动乱，让法律与秩序普照每一寸土地。\n\n当存在已拥有但未整合的领土时，可点击「整合领土」将其纳入帝国统治。"

 je_rome_integrate_button:0 "整合领土"
 je_rome_integrate_button_desc:0 "将所有已拥有但未整合的罗马领土转化为完全整合状态，减少30%现有激进派、增加效忠派，并在一年内获得「罗马和平」：军事征服产生的激进派-50%、政治运动产生的激进派-25%、动乱效果-25%。"

 je_rome_final_integration_button:0 "最终整合"
 je_rome_final_integration_button_desc:0 "所有罗马领土均已整合完毕。完成最终整合，授予永久性修正：政府合法性+20，行政力+5000。"

 rome_pax_romana:0 "罗马和平"
 rome_pax_romana_desc:0 "军事征服产生的激进派-50%，政治运动产生的激进派-25%，动乱效果-25%（持续1年）"

 rome_eternal_city:0 "万城之城"
 rome_eternal_city_desc:0 "政府合法性+20，行政力+5000"

 # ===== 国家议程：奥古斯都 =====
 je_rome_augustus:0 "奥古斯都"
 je_rome_augustus_reason:0 "作为帝国的继承者，我们有权宣称故土的每一寸土地。先吞并埃及与北非，再按顺序征服五大地理区域后，加冕为奥古斯都。\n\n可选阶段：[GetGeographicRegion('geographic_region_roman_egypt').GetName]、[GetGeographicRegion('geographic_region_roman_africa').GetName]。\n宣称顺序：[GetGeographicRegion('geographic_region_roman_italia').GetName]→[GetGeographicRegion('geographic_region_roman_hispania').GetName]→[GetGeographicRegion('geographic_region_roman_danube').GetName]→[GetGeographicRegion('geographic_region_roman_gallia').GetName]→[GetGeographicRegion('geographic_region_roman_britannia').GetName]。每个宣称必须征服后才能解锁下一个。\n\n将鼠标悬停在地名上可在地图上高亮对应区域。最终完整版图见：[GetGeographicRegion('geographic_region_roman_imperium').GetName]。"

 # 奥古斯都状态描述（悬停高亮地理区域）
