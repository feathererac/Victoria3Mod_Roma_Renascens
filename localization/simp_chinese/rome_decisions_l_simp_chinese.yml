 # ===== 新增：罗马化利益集团理念本地化（4个IG） =====
 ideology_rome_legions:0 "罗马军团（Legiones Romanae）"
 ideology_rome_legions_desc:0 "我们是永恒之城的军团。以鹰旗为誓，以纪律为骨，三级权力分配保障军人荣光，万民法让行省子弟皆为帝国而战。"

 ideology_rome_senatorial:0 "元老院贵族（Ordo Senatorius）"
 ideology_rome_senatorial_desc:0 "我们是罗马元老院的菁英。三级权力分配保障元老院权威，混合共和制延续贵族审议，万民法吸纳行省菁英。"

 ideology_rome_pontifices:0 "祭司团（Collegium Pontificum）"
 ideology_rome_pontifices_desc:0 "大祭司统领的罗马祭司团。朱庇特、玛尔斯与维纳斯与我们同在。信仰自由，文化包容，让所有神祇和平共处。"

 ideology_rome_equestrian:0 "骑士阶层（Ordo Equester）"
 ideology_rome_equestrian_desc:0 "我们是骑士阶层——帝国的商贾、工程师与包税人。三级权力分配与混合共和制维护秩序，万民法让地中海的每一个港口都飘扬罗马的商旗。"

 ideology_rome_academia:0 "雅典学院（Academia Atheniensis）"
 ideology_rome_academia_desc:0 "柏拉图的传人，亚里士多德的门徒。雅典学院拥抱理性与贤能政治，万民法让天下英才皆可为罗马所用。"

 ideology_rome_collegia:0 "平民行会（Collegia Opificum）"
 ideology_rome_collegia_desc:0 "罗马平民工匠组成的行会。三级权力分配赋予行会投票权，万民法保障迁徙与工作之权。"

 ideology_rome_plebs_rustica:0 "乡村平民（Plebs Rustica）"
 ideology_rome_plebs_rustica_desc:0 "乡村的罗马平民。作为第三等级的公民，我们以选票与劳作支撑帝国的根基。"

 ideology_rome_plebs_urbana:0 "城市平民（Plebs Urbana）"
 ideology_rome_plebs_urbana_desc:0 "罗马城中千千万万的小作坊主与工匠。面包与竞技场之外，我们更要公民的尊严——Civis Romanus sum。"

