 # ===== State Religion Conversion Decision =====
 rome_restore_religio_romana:0 "Restore the Roman College of Pontiffs"
 rome_restore_religio_romana_desc:0 "The Pontifex Maximus once again holds the reins of state, letting the temples of Jupiter, Mars, and Venus burn incense once more. Officially establish Roman Polytheism as the state religion."
 rome_restore_religio_romana_tooltip:0 "Change state religion to Roman Polytheism, ruler converts to Roman Polytheism."

