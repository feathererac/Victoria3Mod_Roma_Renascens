 # ===== New: Romanized Interest Group Ideology Localization (4 IGs) =====
 ideology_rome_legions:0 "Roman Legions (Legiones Romanae)"
 ideology_rome_legions_desc:0 "We are the legions of the Eternal City. Sworn to the eagle banner, disciplined to the bone, the three-tier power distribution safeguards military glory, and the Jus Gentium lets provincial sons fight for the empire."

 ideology_rome_senatorial:0 "Senatorial Aristocracy (Ordo Senatorius)"
 ideology_rome_senatorial_desc:0 "We are the elite of the Roman Senate. The three-tier power distribution safeguards senatorial authority, the mixed republic continues aristocratic deliberation, and the Jus Gentium absorbs provincial elites."

 ideology_rome_pontifices:0 "College of Pontiffs (Collegium Pontificum)"
 ideology_rome_pontifices_desc:0 "The Roman College of Pontiffs led by the Pontifex Maximus. Jupiter, Mars, and Venus are with us. Freedom of belief, cultural tolerance, let all gods coexist in peace."

 ideology_rome_equestrian:0 "Equestrian Order (Ordo Equester)"
 ideology_rome_equestrian_desc:0 "We are the equestrian order—the empire's merchants, engineers, and tax farmers. The three-tier power distribution and mixed republic maintain order, and the Jus Gentium lets every port of the Mediterranean fly Rome's merchant flag."

 ideology_rome_academia:0 "Athenian Academy (Academia Atheniensis)"
 ideology_rome_academia_desc:0 "Heirs of Plato, disciples of Aristotle. The Athenian Academy embraces reason and meritocracy, and the Jus Gentium lets all talents under heaven serve Rome."

 ideology_rome_collegia:0 "Artisans' Guilds (Collegia Opificum)"
 ideology_rome_collegia_desc:0 "Guilds of Roman plebeian artisans. The three-tier power distribution grants guilds voting rights, and the Jus Gentium guarantees the right to migrate and work."

 ideology_rome_plebs_rustica:0 "Rural Plebeians (Plebs Rustica)"
 ideology_rome_plebs_rustica_desc:0 "Rural Roman plebeians. As third-tier citizens, we support the empire's foundations with our votes and labor."

 ideology_rome_plebs_urbana:0 "Urban Plebeians (Plebs Urbana)"
 ideology_rome_plebs_urbana_desc:0 "The countless small workshop owners and artisans of Rome. Beyond bread and circuses, we demand the dignity of citizenship—Civis Romanus sum."

